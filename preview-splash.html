<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FRIGNANI'S — Splash Screen Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="home">

  <!-- ==========================================
       HOMEPAGE LUXURY SPLASH SCREEN PREVIEW
       ========================================== -->
  <div id="splash-screen" class="splash-screen" role="dialog" aria-modal="true" aria-label="Benvenuti a Frignani's">
    <div class="splash-screen__backdrop"></div>

    <div class="splash-screen__content">
      
      <!-- 1. Header Branding & Flag -->
      <header class="splash-screen__header">
        <div class="splash-screen__logo-wrap">
          <img src="assets/logo/logo-fundo-escuro-web.png" 
               alt="Frignani's" 
               class="splash-screen__logo" 
               width="96" 
               height="122">
        </div>
        
        <div class="splash-screen__flag" aria-label="Italian Origin Flag">
          <span class="splash-screen__flag-color splash-screen__flag-color--green"></span>
          <span class="splash-screen__flag-color splash-screen__flag-color--white"></span>
          <span class="splash-screen__flag-color splash-screen__flag-color--red"></span>
        </div>
      </header>

      <!-- 2. Arched Luxury Wine & Harvest Visual -->
      <div class="splash-screen__visual">
        <div class="splash-screen__arch-frame">
          <div class="splash-screen__gold-arc" aria-hidden="true"></div>
          
          <img src="assets/images/splash-wine-inspiration.jpg" 
               alt="Fine Italian Wine and Vineyard Harvest" 
               class="splash-screen__img">
          
          <div class="splash-screen__img-overlay" aria-hidden="true"></div>

          <!-- 3. Italian Script Tagline: "Una passione ... Mille Sapori" -->
          <div class="splash-screen__tagline-wrap">
            <p class="splash-screen__tagline-text splash-screen__tagline-text--1">
              Una passione ...
            </p>
            <p class="splash-screen__tagline-text splash-screen__tagline-text--2">
              ... Mille Sapori
            </p>
          </div>
        </div>
      </div>

      <!-- 4. Enter / Skip Button -->
      <footer class="splash-screen__footer">
        <button type="button" id="splash-enter-btn" class="splash-screen__btn" aria-label="Enter website">
          <span>Entrar</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
        <span class="splash-screen__hint">Clique em qualquer lugar para continuar</span>
      </footer>

    </div>
  </div>

  <main style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0A1124; color: #FFFFFF; font-family: 'Plus Jakarta Sans', sans-serif; text-align: center; padding: 2rem;">
    <h1 style="font-family: 'Playfair Display', serif; font-size: 3rem; margin-bottom: 1rem; color: #C5A059;">FRIGNANI'S</h1>
    <p style="color: #94A3B8; max-width: 500px;">Italian Excellence & International Trade. The homepage has loaded successfully beneath the splash screen curtain.</p>
    <button onclick="sessionStorage.removeItem('frignanis_splash_seen'); location.reload();" style="margin-top: 2rem; background: #C5A059; color: #080D1A; border: none; padding: 0.75rem 1.5rem; border-radius: 999px; font-weight: 600; cursor: pointer;">Replay Splash Screen</button>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
